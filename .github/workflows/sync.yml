# Copies the Church Center calendar into events.json, which the website reads.
# Runs every 30 minutes, and whenever you press "Run workflow" on the Actions tab.
name: Sync Church Center events

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch events from Church Center
        run: python sync.py

      - name: Save if anything changed
        run: |
          git config user.name "radiant-events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- events.json && [ -z "$(git status --porcelain events.json)" ]; then
            echo "No change."
          else
            git add events.json
            git commit -m "Update events ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
